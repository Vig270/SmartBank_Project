<!DOCTYPE html>
<html>
<head>
<title>GeniusBank Register</title>

<style>

body{
    font-family: Arial;
    background:#f4f6f9;
    text-align:center;
    margin-top:120px;
}

.container{
    background:white;
    width:420px;
    margin:auto;
    padding:40px;
    border-radius:10px;
    box-shadow:0px 5px 20px rgba(0,0,0,0.15);
}

input{
    width:80%;
    padding:12px;
    margin-top:10px;
}

button{
    padding:12px 25px;
    margin-top:15px;
    cursor:pointer;
}

.register{
    background:#43a047;
    color:white;
}

.back{
    background:#1976d2;
    color:white;
}

</style>
</head>

<body>

<div class="container">

<h1>GeniusBank</h1>

<h3>Create Account</h3>

<form action="/register" method="POST">

<input type="text" name="user_id" placeholder="User ID" required>
<br>

<input type="text" name="name" placeholder="Username" required>
<br>

<input type="password" name="password" placeholder="Password" required>
<br>

<button class="register" type="submit">Register</button>

</form>

<br>

<a href="/">
<button class="back" type="button">Back to Login</button>
</a>

</div>

</body>
</html>
